<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#09090b" />
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="url(#grad)" stroke-width="1.5" stroke-opacity="0.5" />
  <!-- AI Neural Node / Monogram LJ -->
  <circle cx="20" cy="24" r="4" fill="#3b82f6" filter="url(#glow)" />
  <circle cx="44" cy="20" r="3.5" fill="#22d3ee" filter="url(#glow)" />
  <circle cx="32" cy="38" r="4.5" fill="#8b5cf6" filter="url(#glow)" />
  <circle cx="22" cy="46" r="3" fill="#3b82f6" filter="url(#glow)" />
  <circle cx="44" cy="44" r="3.5" fill="#22d3ee" filter="url(#glow)" />
  
  <line x1="20" y1="24" x2="32" y2="38" stroke="url(#grad)" stroke-width="2" stroke-opacity="0.8" />
  <line x1="44" y1="20" x2="32" y2="38" stroke="url(#grad)" stroke-width="2" stroke-opacity="0.8" />
  <line x1="20" y1="24" x2="22" y2="46" stroke="url(#grad)" stroke-width="1.5" stroke-opacity="0.6" />
  <line x1="32" y1="38" x2="44" y2="44" stroke="url(#grad)" stroke-width="2" stroke-opacity="0.8" />
</svg>
